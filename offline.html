<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <title>离线模式 - 2027考研英语记忆系统</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        color: #19212c;
        background:
          linear-gradient(180deg, rgba(218, 242, 255, 0.96), rgba(248, 252, 255, 0.98)),
          #eaf7ff;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(99, 102, 241, 0.18);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        padding: 24px;
        box-shadow: 0 20px 60px rgba(25, 33, 44, 0.1);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 14px 0 0;
        color: #526173;
        line-height: 1.75;
      }

      a,
      button {
        margin-top: 20px;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 10px;
        background: #6366f1;
        padding: 0 18px;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线模式</h1>
      <p>网络暂时不可用。如果你已经加载过应用，回到页面后仍可继续使用本地学习数据；网络恢复后再同步云端进度。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
